# ============================================================================
# Build and deploy the Vite site to GitHub Pages.
#
# BEFORE THIS WORKS you must change the Pages source:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# It is currently set to "Deploy from a branch", which serves the repo root
# as-is. That worked for the old static site but cannot build a Vite app.
#
# This workflow deliberately copies the existing root-level files into the
# build output so that every currently-indexed URL keeps resolving:
#   /assets/*      team photos, supporter logos, og-image.jpg, logo.png
#   /privacy.html  indexed, listed in sitemap.xml
#   /terms.html    indexed, listed in sitemap.xml
#   /robots.txt    points crawlers at the sitemap
#   /sitemap.xml   submitted in Search Console
#   /CNAME         custom domain binding for www.inshira.co.uk
# ============================================================================
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Preserve existing site files and SEO assets
        run: |
          set -eux
          # Images keep their original /assets paths. Vite emits its own
          # bundles to dist/static (see vite.config.ts) so there is no clash.
          cp -r assets dist/assets
          # Legal pages stay as real static files, not SPA routes.
          cp privacy.html terms.html dist/
          # Crawler and domain configuration.
          # NOTE: sitemap.xml is deliberately NOT copied here. It is generated
          # into dist/ by scripts/prerender.mjs from the route list and
          # src/data.ts, so it can never fall out of step with what was built.
          # Copying a hand-written file over it would silently undo that.
          cp robots.txt CNAME dist/

      - name: Verify SEO survived the build
        run: |
          set -eu
          fail=0
          check() {
            if grep -qF "$2" dist/index.html; then
              echo "ok: $1"
            else
              echo "MISSING: $1"; fail=1
            fi
          }
          check "canonical URL"      'rel="canonical" href="https://www.inshira.co.uk/"'
          check "og:image"           'https://www.inshira.co.uk/assets/og-image.jpg'
          check "StatCounter project" 'sc_project=13184742'
          check "StatCounter hash"   'sc_security="19e5be03"'
          check "robots directive"   'name="robots" content="index, follow"'
          check "Organization JSON-LD" '"@type": "Organization"'
          for f in privacy.html terms.html robots.txt sitemap.xml CNAME; do
            if [ -f "dist/$f" ]; then echo "ok: $f"; else echo "MISSING: $f"; fail=1; fi
          done
          if [ ! -d dist/assets ]; then echo "MISSING: dist/assets"; fail=1; fi
          # Each route must exist as a real file so GitHub Pages returns 200
          # rather than the 404.html bounce, which Google will not index.
          for r in platform solutions industries case-studies resources about contact; do
            if [ -f "dist/$r/index.html" ]; then echo "ok: /$r"; else echo "MISSING route: /$r"; fail=1; fi
          done

          # Every article in src/data.ts must have been prerendered to its own
          # page AND listed in the generated sitemap. This is the check that
          # catches a new article silently failing to get a shareable URL —
          # for example if its slug or metaTitle were reformatted in a way the
          # prerender parser cannot read.
          slugs=$(grep -oE "^    slug: '[^']+'" src/data.ts | sed "s/^    slug: '//; s/'$//")
          if [ -z "$slugs" ]; then echo "MISSING: no article slugs parsed"; fail=1; fi
          for s in $slugs; do
            if [ -f "dist/resources/$s/index.html" ]; then
              echo "ok: /resources/$s"
            else
              echo "MISSING article page: /resources/$s"; fail=1
            fi
            # Tolerate either URL form. The sitemap now lists the canonical
            # trailing-slash URLs; this check previously assumed no slash and
            # blocked the deploy when that changed.
            if grep -qE "/resources/$s/?<" dist/sitemap.xml; then
              echo "ok: sitemap lists /resources/$s"
            else
              echo "MISSING from sitemap: /resources/$s"; fail=1
            fi
          done
          exit $fail

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
