# ============================================================================
# Build and deploy the Vite site to GitHub Pages.
#
# BEFORE THIS WORKS you must change the Pages source:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# It is currently set to "Deploy from a branch", which serves the repo root
# as-is. That worked for the old static site but cannot build a Vite app.
#
# This workflow deliberately copies the existing root-level files into the
# build output so that every currently-indexed URL keeps resolving:
#   /assets/*      team photos, supporter logos, og-image.jpg, logo.png
#   /privacy.html  indexed, listed in sitemap.xml
#   /terms.html    indexed, listed in sitemap.xml
#   /robots.txt    points crawlers at the sitemap
#   /sitemap.xml   submitted in Search Console
#   /CNAME         custom domain binding for www.inshira.co.uk
# ============================================================================
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Preserve existing site files and SEO assets
        run: |
          set -eux
          # Images keep their original /assets paths. Vite emits its own
          # bundles to dist/static (see vite.config.ts) so there is no clash.
          cp -r assets dist/assets
          # Legal pages stay as real static files, not SPA routes.
          cp privacy.html terms.html dist/
          # Crawler and domain configuration.
          cp robots.txt sitemap.xml CNAME dist/

      - name: Verify SEO survived the build
        run: |
          set -eu
          fail=0
          check() {
            if grep -qF "$2" dist/index.html; then
              echo "ok: $1"
            else
              echo "MISSING: $1"; fail=1
            fi
          }
          check "canonical URL"      'rel="canonical" href="https://www.inshira.co.uk/"'
          check "og:image"           'https://www.inshira.co.uk/assets/og-image.jpg'
          check "StatCounter project" 'sc_project=13184742'
          check "StatCounter hash"   'sc_security="19e5be03"'
          check "robots directive"   'name="robots" content="index, follow"'
          check "Organization JSON-LD" '"@type": "Organization"'
          for f in privacy.html terms.html robots.txt sitemap.xml CNAME; do
            if [ -f "dist/$f" ]; then echo "ok: $f"; else echo "MISSING: $f"; fail=1; fi
          done
          if [ ! -d dist/assets ]; then echo "MISSING: dist/assets"; fail=1; fi
          exit $fail

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
